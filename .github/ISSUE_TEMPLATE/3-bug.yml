name: Bug or install problem
description: The extension does not load, or does not work as the README describes.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys. For a security problem, do not use this form. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      description: Include a public page address if the bug depends on a page.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Load unpacked from the extension folder
        - Unzipped a release zip, then Load unpacked
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Subtext version, browser and operating system
      placeholder: 0.2.0, Chrome 142, Windows 11
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors shown
      description: Any error text from the extensions page of your browser. Remove personal paths first.
      render: text
    validations:
      required: false
